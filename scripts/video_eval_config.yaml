# Default video-eval config: 4 generic Kinetics-400 recognizers + top-down PoseC3D (FineGYM).
# All paths are relative to the repo root; checkpoints are explicit here (auto-resolution from a
# config's own metafile.yml is optional-checkpoint behavior exercised separately, not used by this
# default file).
#
# Schema (authoritative implementation: scripts/sweep/runners/recognizer.py and
# scripts/sweep/runners/skeleton.py; see run_recognizer and run_skeleton_topdown for
# exactly what each field is used for):
#
# top_k: int, optional, default 5. Number of ranked predictions written per (video, model) pair.
#
# models: list of model entries. Every entry needs a `type` of `recognizer` or `skeleton_topdown`,
# which selects which fields below are required.
#
#   type: recognizer  (plain RGB action recognition, e.g. SlowFast/Swin/TimeSformer/VideoMAE)
#     name        - required. Identifies the model in the output CSV's model_name column and in
#                   resume tracking (matched against existing (video_path, model_name) CSV rows).
#     config      - required. Path to an mmaction2 recognizer config.
#     checkpoint  - optional. Local path or http(s) URL. If omitted, resolved by looking up
#                   `config`'s own metafile.yml for a Results entry whose Dataset matches
#                   `dataset` below (case-insensitive), and downloading/caching that Weights URL
#                   into checkpoints/.
#     dataset     - required. Written to the output CSV's dataset column, and used to pick the
#                   right Results entry when resolving an omitted checkpoint above.
#     label_map   - required. Path to a newline-delimited label file (line index == class index).
#     device      - required. e.g. cuda:0 or cpu.
#
#   type: skeleton_topdown  (person detection -> pose estimation -> PoseC3D classification)
#     name                  - required, as above.
#     detector_config       - required. Path to the person-detector config.
#     detector_checkpoint   - optional, resolved from detector_config's metafile.yml if omitted
#                             (same dataset-lookup rule as `checkpoint` above).
#     pose_config           - required. Path to the top-down pose-estimator config.
#     pose_checkpoint       - optional, resolved from pose_config's metafile.yml if omitted.
#     classifier_config     - required. Path to the PoseC3D skeleton-classifier config.
#     classifier_checkpoint - optional, resolved from classifier_config's metafile.yml if omitted.
#     dataset               - required, as above (also the dataset used for all three metafile
#                             lookups above).
#     label_map             - required, as above.
#     device                - required, as above.
#     det_score_thr         - optional, default 0.9. Minimum detector confidence score kept
#                             before handing detections to pose estimation.
#     det_cat_id            - optional, default 0. Detector category id treated as "person".
top_k: 5

models:
  - name: slowfast
    type: recognizer
    config: configs/recognition/slowfast/slowfast_r50_8xb8-8x8x1-256e_kinetics400-rgb.py
    checkpoint: https://download.openmmlab.com/mmaction/v1.0/recognition/slowfast/slowfast_r50_8xb8-8x8x1-256e_kinetics400-rgb/slowfast_r50_8xb8-8x8x1-256e_kinetics400-rgb_20220818-1cb6dfc8.pth
    dataset: Kinetics-400
    label_map: tools/data/kinetics/label_map_k400.txt
    device: cuda:0

  - name: swin
    type: recognizer
    config: configs/recognition/swin/swin-tiny-p244-w877_in1k-pre_8xb8-amp-32x2x1-30e_kinetics400-rgb.py
    checkpoint: https://download.openmmlab.com/mmaction/v1.0/recognition/swin/swin-tiny-p244-w877_in1k-pre_8xb8-amp-32x2x1-30e_kinetics400-rgb/swin-tiny-p244-w877_in1k-pre_8xb8-amp-32x2x1-30e_kinetics400-rgb_20220930-241016b2.pth
    dataset: Kinetics-400
    label_map: tools/data/kinetics/label_map_k400.txt
    device: cuda:0

  - name: timesformer
    type: recognizer
    config: configs/recognition/timesformer/timesformer_divST_8xb8-8x32x1-15e_kinetics400-rgb.py
    checkpoint: https://download.openmmlab.com/mmaction/v1.0/recognition/timesformer/timesformer_divST_8xb8-8x32x1-15e_kinetics400-rgb/timesformer_divST_8xb8-8x32x1-15e_kinetics400-rgb_20220815-a4d0d01f.pth
    dataset: Kinetics-400
    label_map: tools/data/kinetics/label_map_k400.txt
    device: cuda:0

  - name: videomae
    type: recognizer
    config: configs/recognition/videomae/vit-base-p16_videomae-k400-pre_16x4x1_kinetics-400.py
    checkpoint: https://download.openmmlab.com/mmaction/v1.0/recognition/videomae/vit-base-p16_videomae-k400-pre_16x4x1_kinetics-400_20221013-860a3cd3.pth
    dataset: Kinetics-400
    label_map: tools/data/kinetics/label_map_k400.txt
    device: cuda:0

  - name: posec3d
    type: skeleton_topdown
    detector_config: configs/person_detector/faster-rcnn_r50_fpn_2x_coco_infer.py
    detector_checkpoint: http://download.openmmlab.com/mmdetection/v2.0/faster_rcnn/faster_rcnn_r50_fpn_2x_coco/faster_rcnn_r50_fpn_2x_coco_bbox_mAP-0.384_20200504_210434-a5d8aa15.pth
    pose_config: configs/skeleton_coord/td-hm_hrnet-w32_8xb64-210e_coco-256x192_infer.py
    pose_checkpoint: https://download.openmmlab.com/mmpose/top_down/hrnet/hrnet_w32_coco_256x192-c78dce93_20200708.pth
    classifier_config: configs/skeleton/posec3d/slowonly_r50_8xb16-u48-240e_gym-limb.py
    classifier_checkpoint: https://download.openmmlab.com/mmaction/v1.0/skeleton/posec3d/slowonly_r50_8xb16-u48-240e_gym-limb/slowonly_r50_8xb16-u48-240e_gym-limb_20220815-2e6e3c5c.pth
    dataset: FineGYM
    label_map: tools/data/skeleton/label_map_gym99.txt
    device: cuda:0
